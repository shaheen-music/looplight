<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Looplight</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0e1121">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Looplight">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
/* Layout: a rainy-window scene on top, the current tune and its 16-bar shape beneath, one row of controls last.
   Single look by choice: a room at night, deep indigo with lamp light. */
:root{
  --bg:#0e1121;
  --surface:#161a2f;
  --surface-2:#1f2442;
  --line:#2c3254;
  --fg:#f1e9dd;
  --muted:#9d9ab4;
  --lamp:#ffb45a;
  --lamp-ink:#241402;
  --lamp-soft:rgba(255,180,90,.16);
  --lamp-rgb:255,180,90;
  --past:#5a4a58;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html[data-mode="japan"]{--bg:#0c0e1e;--surface:#141830;--surface-2:#1e2442;--line:#313a5e;--fg:#f3ece4;--muted:#a3a7c2;--lamp:#f0a2b3;--lamp-ink:#2a0d16;--lamp-soft:rgba(240,162,179,.14);--lamp-rgb:240,162,179;--past:#444f7a}
html[data-mode="groove"]{--bg:#0e1a17;--surface:#15251f;--surface-2:#1e352b;--line:#2e4a3c;--fg:#f4f0e2;--muted:#9fb7a8;--lamp:#b9e38c;--lamp-ink:#142208;--lamp-soft:rgba(185,227,140,.15);--lamp-rgb:185,227,140;--past:#3f6150}
*{box-sizing:border-box}
html:not([data-mode="cozy"]) .only-cozy,html:not([data-mode="groove"]) .only-groove,html:not([data-mode="japan"]) .only-japan{display:none}
.titlebox{display:flex;flex-direction:column;gap:2px}
.tagline{margin:0;font:400 .78rem/1.3 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.flipbtn{display:inline-flex;align-items:center;gap:.35rem;min-height:32px;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--lamp);background:var(--lamp-soft);color:var(--lamp);font:600 .74rem/1 var(--f-body);cursor:pointer}
.flipbtn:hover{filter:brightness(1.12)}
.flips{display:inline-flex;gap:8px;flex-wrap:wrap}
.topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
main.wrap{transform-origin:center top}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-block:20px 40px;padding-inline:16px}
.wrap{max-width:920px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px}
h1{margin:0;font:400 clamp(1.2rem,1.05rem + 1vw,1.6rem)/1.15 var(--f-display);letter-spacing:.005em}
.status{margin:0;font:400 .78rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status b{font-weight:500;color:var(--lamp)}

.scene{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
#scene{display:block;width:100%;height:clamp(220px,40vw,380px)}

.np{display:flex;flex-direction:column;gap:14px;min-width:0}
.np-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{margin:0;font:500 .7rem/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font:400 clamp(1.7rem,1.2rem + 2.4vw,2.6rem)/1.08 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.codebtn{background:none;border:0;padding:0;font:inherit;color:var(--lamp);cursor:pointer;text-decoration:underline dotted}
.replay{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.75rem 0}
.replay label{font:500 .85rem var(--f-sans);color:var(--muted)}
.replay input{flex:1 1 9rem;min-width:0;background:var(--surface);color:inherit;border:1px solid #ffffff22;border-radius:.6rem;padding:.55rem .7rem;font:400 .9rem var(--f-mono)}
.meta{margin:0;font:400 .85rem/1.4 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.upnext{margin:0;font-size:.85rem;color:var(--muted)}
.upnext span{color:var(--fg)}

.shape{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}
.sec{display:flex;flex-direction:column;gap:6px;min-width:0}
.ticks{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tick{height:8px;border-radius:3px;background:var(--surface-2);transition:background .2s}
.tick.past{background:var(--past)}
.tick.now{background:var(--lamp);box-shadow:0 0 10px rgba(var(--lamp-rgb),.55)}
.sec-name{font:500 .68rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.on .sec-name{color:var(--fg)}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:48px;padding:.7rem 1.2rem;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:500 .95rem/1 var(--f-body);cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.play{min-width:140px;background:var(--lamp);color:var(--lamp-ink);border-color:transparent;font-weight:600}
.btn.play:hover{filter:brightness(1.06)}
.vol{display:flex;align-items:center;gap:10px;flex:1 1 180px;min-width:0}
.vol label{font:500 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vol output{font:400 .8rem/1 var(--f-mono);color:var(--fg);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--lamp);background:transparent}
.toggles{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1 1 100%}
.tog{min-height:42px;padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 .85rem/1 var(--f-body);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--lamp-soft);border-color:var(--lamp);color:var(--lamp)}
/* the per-side sound toggles (vinyl, rain, street hum, stream and so on) are a little smaller */
.tog.only-cozy,.tog.only-groove,.tog.only-japan{min-height:34px;padding:.35rem .8rem;font-size:.74rem}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.hint{margin:0;font:400 .76rem/1.6 var(--f-mono);color:var(--muted)}
kbd{font:500 .72rem var(--f-mono);padding:.1rem .35rem;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--fg)}
@media (max-width:520px){.shape{gap:6px}.sec-name{letter-spacing:.04em;font-size:.62rem}.btn.play{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){.btn,.tick{transition:none}}
</style>

<main class="wrap">
  <header class="top">
    <div class="titlebox"><h1 id="appName">Looplight</h1><p class="tagline" id="tagline">Cozy · wind down, relax, sleep</p></div>
    <div class="topright"><p class="status" id="status">Ready</p><span class="flips" id="flips"></span></div>
  </header>

  <section class="scene"><canvas id="scene" role="img" aria-label="An animated scene that moves with the music: a rainy night window in Cozy mode, a sunny golden-hour hillside in Sunny Side mode, a moonlit Japanese garden with a pagoda and falling cherry petals in Japanese Classical mode."></canvas></section>

  <section class="np" aria-live="polite">
    <div class="np-head">
      <p class="eyebrow" id="eyebrow">Up first</p>
      <h2 id="title">Slow Sunday</h2>
      <p class="meta" id="meta">F major · 76 BPM</p>
      <p class="meta"><button type="button" class="codebtn" id="codeBtn" title="Copy this tune's code">Code: <span id="codeTxt">-</span></button></p>
    </div>
    <div class="shape" id="shape" aria-label="Where you are in the tune"></div>
    <p class="upnext" id="upnext"></p>
  </section>

  <section class="controls">
    <button type="button" class="btn play" id="play"></button>
    <button type="button" class="btn" id="next">Next tune</button>
    <div class="vol"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" step="1" value="50"><output id="volOut">50</output></div>
    <form class="replay" id="replay"><label for="codeIn">Replay a tune</label><input id="codeIn" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="e.g. 1k9x2a-3" maxlength="14"><button type="submit" class="btn">Play code</button></form>
    <div class="toggles">
      <button type="button" class="tog" id="tAuto" aria-pressed="true">Change tunes automatically</button>
      <button type="button" class="tog" id="tSleep" aria-pressed="false">Sleep timer: off</button>
      <button type="button" class="tog" id="tBass" aria-pressed="false" title="Adds the deepest bass notes and kick. You will only hear it on headphones or real speakers; a phone speaker cannot play it, so it starts off on phones.">Deep bass (headphones)</button>
      <button type="button" class="tog only-cozy" id="tVinyl" aria-pressed="false">Vinyl crackle</button>
      <button type="button" class="tog only-cozy" id="tRain" aria-pressed="false">Rain</button>
      <button type="button" class="tog only-cozy" id="tFire" aria-pressed="false">Fireplace</button>
      <button type="button" class="tog only-cozy" id="tThunder" aria-pressed="false">Distant thunder</button>
      <button type="button" class="tog only-groove" id="tKeys" aria-pressed="false">Keyboard</button>
      <button type="button" class="tog only-groove" id="tCity" aria-pressed="false">Street hum</button>
      <button type="button" class="tog only-groove" id="tWaves" aria-pressed="false">Ocean waves</button>
      <button type="button" class="tog only-groove" id="tBirds" aria-pressed="false">Birdsong</button>
      <button type="button" class="tog only-japan" id="tJStream" aria-pressed="false">Garden stream</button>
      <button type="button" class="tog only-japan" id="tJChime" aria-pressed="false">Wind chimes</button>
      <button type="button" class="tog only-japan" id="tJBell" aria-pressed="false">Temple bell</button>
      <button type="button" class="tog only-japan" id="tShishi" aria-pressed="false">Bamboo fountain</button>
    </div>
  </section>

  <p class="hint"><kbd>Space</kbd> play or pause, <kbd>N</kbd> next tune, <kbd>F</kbd> flip the card. Each tune is composed fresh: chords, bass, a melody and drums, about two minutes long.</p>
</main>

function idxMidi(root,iv,idx){return root+12*Math.floor(idx/7)+iv[((idx%7)+7)%7];}

function genPhrase(T){
  const sc=T.scaleNotes,RH=T.mode==='groove'?RHY_G:RHY;
  /* a tune with a question and an answer: the hook, the hook answered a step away, a contrasting turn, then a resolving close */
  const r1=pick(RH),r2=pick(RH.filter(r=>r!==r1)),r3=pick(RH.filter(r=>r!==r1&&r!==r2));

  if(smpState===2)return Promise.resolve();
  if(smpState===1)return new Promise(r=>smpWait.push(r));
  smpState=1;SMP={};
  const jobs=[];
  Object.keys(window.__SMP||{}).forEach(inst=>{
    const cfg=SMP_CFG[inst];SMP[inst]={keys:[],map:{}};
    Object.keys(window.__SMP[inst]).map(Number).sort((a,b)=>a-b).forEach(m=>{
      jobs.push(ac.decodeAudioData(b64buf(window.__SMP[inst][m])).then(buf=>{
        const x=buf.getChannelData(0),sr=buf.sampleRate;let pk=0,on=0;
        for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);if(a>pk)pk=a;}
        for(let i=0;i<x.length;i++){if(Math.abs(x[i])>pk*0.03){on=i;break;}}
        let meas;
        if(cfg.norm==='peak')meas=pk||1;
        else{let e=0,n=0;for(let i=Math.floor(sr*0.3);i<Math.min(x.length,Math.floor(sr*1.5));i++){e+=x[i]*x[i];n++;}meas=Math.sqrt(e/Math.max(1,n))||1;}
        SMP[inst].keys.push(m);SMP[inst].map[m]={buf:buf,on:on/sr,g:Math.min(8,cfg.target/meas)};
      }).catch(()=>{}));
    });
  });
  return Promise.all(jobs).then(()=>{Object.keys(SMP).forEach(k=>SMP[k].keys.sort((a,b)=>a-b));smpState=2;const w=smpWait;smpWait=[];w.forEach(f=>f());});
}
/* one note from a recording: re-pitched from the nearest sample, shaped with its own attack and release */
function playSample(inst,t,midi,v,dur,dest,opt){
  const set=SMP&&SMP[inst];if(!set||!set.keys.length)return;
  const cfg=SMP_CFG[inst],key=set.keys[nearIdx(set.keys,midi)],smp=set.map[key];
  const rate=Math.pow(2,(midi-key)/12),src=ac.createBufferSource();src.buffer=smp.buf;src.playbackRate.value=rate;
  const g=ac.createGain(),peak=Math.max(0.0001,v*smp.g*((opt&&opt.gain)||1));
  const hold=Math.max(0.12,dur),rel=(opt&&opt.rel)||cfg.rel;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+cfg.a);
  let end=t+hold;
  if(cfg.sus||(opt&&opt.cut)){
    g.gain.setValueAtTime(peak,end);g.gain.linearRampToValueAtTime(0.0001,end+rel);end+=rel+0.04;
  }else end=t+smp.buf.duration/rate;
  end=Math.min(end,t+(smp.buf.duration-smp.on)/rate);
  if(cfg.vib&&!S.lite){
    const l=ac.createOscillator();l.frequency.value=4.6+Math.random()*0.4;const lg=ac.createGain();
    lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(cfg.vib*(hold>0.8?1:0.3),t+Math.min(0.9,hold*0.8));
    l.connect(lg);lg.connect(src.detune);l.start(t);l.stop(end+0.05);
  }
  if(opt&&opt.scoop){src.detune.setValueAtTime(-170,t);src.detune.linearRampToValueAtTime(0,t+0.2);}
  if(opt&&opt.fall){src.detune.setValueAtTime(0,t+hold-0.05);src.detune.linearRampToValueAtTime(-220,t+hold+rel);}
  if(cfg.lp&&!S.lite){const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cfg.lp;lp.Q.value=0.5;src.connect(lp);lp.connect(g);}else src.connect(g);
  g.connect(dest);src.start(t,smp.on);src.stop(end+0.05);
}
function scheduleJapanBar(T,t0,bar,sec,bi,e,st,ending){
  const busy=(sec===3||sec===4);
  const d=(busy?T.progB:T.progA)[bi],kp=T.kpool,c=T.idx0+d;
  const kn=i=>kp[clamp(i,0,kp.length-1)];
  const hum=()=>(Math.random()-0.5)*0.018;
  /* koto accompaniment: a rolling arpeggio, gentle in the Jo, flowing in the Ha, fuller in the Kyu */
  const pat=sec===0?T.kintro:(busy?T.kbusy:(sec===1||sec===5||sec===7?T.kpat:T.kbusy));
  const kv=sec===0?0.42:(busy?0.5:0.4);
  pat.forEach((q,i)=>{
    if(S.lite&&i%2)return;
    playSample('koto',st(q[0])+hum(),kn(c+q[1]),q[0]===0?kv+0.1:kv,1.6,bus);
  });
  if(bi%2===0)playSample('koto',t0+hum(),kn(T.idx0-5+(d>2?2:0)),0.55,1.8,bus);
  /* a quick koto glissando to close a phrase */
  if(bi===3&&(sec===0||sec===2||sec===4||sec===7)){
    const up=sec!==7;
    for(let k=0;k<7;k++)playSample('koto',st(6)+k*0.075,kn(T.idx0+(up?k:7-k)),0.3+k*0.04,1.2,bus);
  }
  uiQ.push({t:t0,k:'kick'});
  /* the tune: sung by a bright koto, with the shakuhachi doubling it softly an octave down in the later halves */
  const pk=PLAN[sec].ph;
  if(pk&&T[pk]){
    const notes=T[pk][bi];
    notes.forEach(n=>{
      const t=st(n.step)+0.01+hum();
      playSample('koto',t,n.midi,n.step===0?0.95:0.8,1.6,bus,{gain:1.15});
      if((sec===2||sec===4||sec===6||sec===7)&&!S.lite)playSample('shaku',t+0.03,n.midi-12>=56?n.midi-12:n.midi,0.55,Math.min(3,n.dur*e*0.95),bus);
      uiQ.push({t:t,k:'note',m:n.midi});
    });
  }
}
const HARM_VOICE={kalimba:'pluck',marimba:'kalimba',pluck:'kalimba',synth:'marimba',epiano:'kalimba'};
function playMelody(T,t,m,v,voice){
  const f=mtof(m);
  switch(voice||T.melVoice){
    case 'kalimba':voiceKalimba(t,f,v);break;
    case 'marimba':voiceMarimba(t,f,v);break;
    case 'pluck':voicePluck(t,f,v);break;
    case 'synth':voiceSynth(t,f,v);break;
    default:voiceEPiano(t,f,v*0.85);
  }
}

function ensureBuses(T){

  T.dbus=ac.createGain();T.dbus.connect(drumMain);
  live.push(T);

}
function scheduleBar(t0){
  const T=tune,bar=barNum,sec=bar>>2,bi=bar&3,cfg=MODES[T.mode];
  ensureBuses(T);
  bus=T.bus;drumBus=T.dbus;
  const e=60/T.bpm/2;
  const st=s=>t0+s*e+((s&1)?T.swing*e:0);
  const ending=(bar===31&&S.auto);
  const dropOut=ending||(sec===3&&bi<2);

  if(bar===0)delayNode.delayTime.setTargetAtTime(60/T.bpm,t0,0.08);
  /* transitions: the new tune swells in over its first bar; the old one thins out over its last two, then its reverb and delay tails ring away */
  const barLen=e*8;
  if(bar===0){
    [T.bus,T.dbus].forEach(b=>{b.gain.cancelScheduledValues(t0);b.gain.setValueAtTime(0.12,t0);b.gain.linearRampToValueAtTime(1,t0+barLen*0.9);});
  }
  if(S.auto&&bar===30){
    [T.bus,T.dbus].forEach(b=>{b.gain.cancelScheduledValues(t0);b.gain.setValueAtTime(1,t0);b.gain.linearRampToValueAtTime(0.7,t0+barLen);});
  }
  if(ending){
    [T.bus,T.dbus].forEach(b=>{b.gain.cancelScheduledValues(t0);b.gain.setValueAtTime(0.7,t0);b.gain.linearRampToValueAtTime(0.25,t0+barLen);b.gain.setTargetAtTime(0,t0+barLen,0.6);});

    const wf=ac.createBiquadFilter();wf.type='bandpass';wf.Q.value=0.8;wf.frequency.setValueAtTime(500,t0);wf.frequency.exponentialRampToValueAtTime(4200,t0+barLen);

    const t=st(s),v=i===0?0.7:0.4;

  });

  T.bassPat.forEach((s,i)=>voiceBass(st(s),T.bass[bi],e*(i===0?cfg.bassDur[0]:cfg.bassDur[1]),i===0?1:0.7));

  const pk=PLAN[sec].ph;
  if(pk){

    ph[bi].forEach(n=>{
      const t=st(n.step);
      playMelody(T,t,n.midi,n.step===0?0.95:0.78);
      /* in the second half of each section a softer voice sings a third below */
      if((sec===2||sec===4||sec===6)&&!S.lite){const hi=T.scaleNotes.indexOf(n.midi);if(hi>=2)playMelody(T,t+0.012,T.scaleNotes[hi-2],0.42,HARM_VOICE[T.melVoice]||'kalimba');}

}
function advance(){
  if(barNum===28&&!nextTune)nextTune=compose(tune.keyPc,null,mode);
  if(barNum===31){
    if(S.auto){tune=nextTune||compose(tune.keyPc,null,mode);nextTune=null;barNum=0;}
    else barNum=4;
  }else if(!S.auto&&barNum===27)barNum=4;

}
function pump(){
  if(!playing||!ac)return;
  const LA=window.__COZY_LOOKAHEAD||1.4;
  while(nextBarTime<ac.currentTime+LA){
    if(window.__COZY_BARS&&barCount>=window.__COZY_BARS)break;
    if(nextBarTime<ac.currentTime)nextBarTime=ac.currentTime+0.1;
    const dur=60/tune.bpm*4;
    scheduleBar(nextBarTime);barCount++;
    nextBarTime+=dur;
    advance();
  }
}
function startTicker(){
  stopTicker();
  try{
    const url=URL.createObjectURL(new Blob(['var id=setInterval(function(){postMessage(0)},40);onmessage=function(){clearInterval(id)}'],{type:'text/javascript'}));
    worker=new Worker(url);worker.onmessage=pump;
    worker.onerror=function(){if(worker){worker.terminate();worker=null;}if(!timer)timer=setInterval(pump,40);};
  }catch(err){timer=setInterval(pump,40);}
}
function stopTicker(){
  if(worker){try{worker.postMessage('stop');}catch(e){}worker.terminate();worker=null;}
  if(timer){clearInterval(timer);timer=null;}
}
let wake=null;
async function lockScreen(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}

  if(!started){started=true;barNum=0;barCount=0;nextBarTime=ac.currentTime+0.15;startTicker();}
  clearTimeout(suspendT);
  try{const now=ac.currentTime;holdGain(outVol.gain,now);outVol.gain.setValueAtTime(Math.max(outVol.gain.value,0.0001),now);outVol.gain.setTargetAtTime(volGain(),now+0.02,0.04);}catch(e){}

}
let suspendT=null;
function pause(){
  playing=false;unlockScreen();

  try{const now=ac.currentTime;holdGain(outVol.gain,now);outVol.gain.setTargetAtTime(0,now,0.025);}catch(e){}
  clearTimeout(suspendT);
  suspendT=setTimeout(()=>{if(playing)return;try{const p=ac.suspend();if(p&&p.catch)p.catch(()=>{});}catch(e){}},220);
  renderStatus();renderPlayBtn();
}
const toggle=()=>playing?pause():start();
function nextNow(){
  if(mode==='japan'&&ac&&smpState!==2){loadingBand=true;renderStatus();loadSamples().then(()=>{loadingBand=false;renderStatus();nextNow();});return;}
  const fresh=nextTune||compose(tune.keyPc,null,mode);nextTune=null;
  if(!started||!ac){tune=fresh;barNum=0;shown=null;renderTune(tune,0);return;}
  const now=ac.currentTime;
  live.forEach(T=>{try{holdGain(T.bus.gain,now);T.bus.gain.setTargetAtTime(0,now,0.3);holdGain(T.dbus.gain,now);T.dbus.gain.setTargetAtTime(0,now,0.3);}catch(e){}});

function switchModeCore(m){
  mode=m;nextTune=null;const cfg=MODES[m];
  document.documentElement.dataset.mode=m;
  $('appName').textContent='Looplight';$('tagline').textContent=FLIP_NAME[mode]+' · '+cfg.tagline;renderFlips();
  labEls.forEach((l,i)=>{l.textContent=cfg.plan[i];});
  if(ac){toneLP.frequency.setTargetAtTime(cfg.tone,ac.currentTime,0.3);mainBus.gain.setTargetAtTime(0.9*cfg.trim,ac.currentTime,0.3);drumMain.gain.setTargetAtTime(0.9*cfg.trim,ac.currentTime,0.3);}

let flipping=false;
function flipCard(to){
  if(MODE_ORDER.indexOf(to)<0||to===mode)to=MODE_ORDER[(MODE_ORDER.indexOf(mode)+1)%MODE_ORDER.length];
  const main=document.querySelector('main');
  if(reduceMotion||!main.animate){setMode(to);return;}
  if(flipping)return;flipping=true;
  /* one animation, no fill: whatever happens (a busy page, a cancelled frame) the card always ends up flat again */
  const P='perspective(1400px) rotateY(';
  const done=()=>{if(!flipping)return;flipping=false;try{main.getAnimations().forEach(a=>a.cancel());}catch(e){}main.style.transform='';};
  try{
    const anim=main.animate([{transform:P+'0deg)',offset:0,easing:'ease-in'},{transform:P+'90deg)',offset:0.43},{transform:P+'-90deg)',offset:0.4301,easing:'ease-out'},{transform:P+'0deg)',offset:1}],{duration:530,fill:'none'});
    anim.onfinish=done;anim.oncancel=done;
  }catch(e){done();}
  setTimeout(()=>{try{setMode(to);}catch(e){}},230);
  setTimeout(done,1100);
}
/* sleep timer: fades everything out over the last 30 seconds, then pauses */
const SLEEP_STEPS=[0,15,30,60];let sleepIdx=0,sleepEnd=0,sleepTick=null,sleepFading=false;
function sleepRestore(){if(!ac)return;const now=ac.currentTime;holdGain(outVol.gain,now);outVol.gain.setTargetAtTime(volGain(),now,0.05);sleepFading=false;}
function renderSleep(){
  const b=$('tSleep'),min=SLEEP_STEPS[sleepIdx];
  if(!min){b.textContent='Sleep timer: off';b.setAttribute('aria-pressed','false');return;}
  const left=Math.max(0,Math.ceil((sleepEnd-Date.now())/60000));
  b.textContent='Sleep in '+left+' min';b.setAttribute('aria-pressed','true');
}
function sleepStep(){
  const left=sleepEnd-Date.now();
  if(left<=0){clearInterval(sleepTick);sleepTick=null;sleepIdx=0;pause();sleepRestore();renderSleep();return;}
  if(left<=30000&&!sleepFading&&ac&&playing){sleepFading=true;const now=ac.currentTime;holdGain(outVol.gain,now);outVol.gain.setTargetAtTime(0,now,7);}
  renderSleep();
}
function cycleSleep(){
  sleepIdx=(sleepIdx+1)%SLEEP_STEPS.length;
  if(sleepTick){clearInterval(sleepTick);sleepTick=null;}
  sleepRestore();
  const min=SLEEP_STEPS[sleepIdx];
  if(min){sleepEnd=Date.now()+min*60000;sleepTick=setInterval(sleepStep,1000);}
  renderSleep();
}
function playCode(str){

  if(c.mode!==mode)switchModeCore(c.mode);
  nextTune=compose(tune.keyPc,c);nextNow();
}

  else if(e.key==='n'||e.key==='N'){nextNow();}
  else if(e.key==='f'||e.key==='F'){flipCard();}
});

/* ================= scene ================= */
const cv=$('scene'),cx=cv.getContext('2d');
let W=0,H=0,dpr=1;
let stars=[],bokeh=[],drops=[],flies=[],steam=[];
let pulse=0,shownBar=-1;
function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function initScene(){
  const r=seeded(7);
  stars=[];for(let i=0;i<46;i++)stars.push({x:r(),y:r()*0.42,s:0.4+r()*1.1,p:r()*6.28});
  const cols=['255,207,138','255,159,107','143,183,255','255,217,166','201,167,255'];
  bokeh=[];for(let i=0;i<38;i++)bokeh.push({x:r(),y:0.5+r()*0.28,s:0.008+r()*0.02,c:cols[Math.floor(r()*cols.length)],a:0.22+r()*0.35,p:r()*6.28});
  const n=Math.round(W/9);
  drops=[];for(let i=0;i<n;i++)drops.push({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*18,v:260+Math.random()*220});
}
function layout(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);initScene();initCity();
}
function spawnFly(m){
  if(reduceMotion)return;
  if(mode==='japan'){
    flies.push({x:W*(0.05+Math.random()*0.9),y:-8,vx:-(6+Math.random()*14),vy:(16+Math.random()*20)*(H/300),age:0,life:5+Math.random()*3,p:Math.random()*6.28});
    if(flies.length>60)flies.shift();return;
  }
  const x=W*(0.14+0.72*clamp((m-64)/18,0,1)),y=H*0.8;
  flies.push({x:x,y:y,vx:(Math.random()-0.5)*14,vy:-(18+Math.random()*26)*(H/300),age:0,life:2.6+Math.random()*1.6,p:Math.random()*6.28});
  if(flies.length>70)flies.shift();
}
function processQueue(){
  if(!ac||!playing)return;
  const now=ac.currentTime-(ac.outputLatency||0);
  while(uiQ.length&&uiQ[0].t<now){
    const e=uiQ.shift();
    if(e.k==='kick')pulse=1;
    else if(e.k==='note')spawnFly(e.m);
    else if(e.k==='bar'){renderTune(e.tune,e.bar);}
  }
}
let city=[];
function initCity(){}
function drawGroove(dt,time){
  cx.setTransform(dpr,0,0,dpr,0,0);
  const hz=H*0.66;
  const sky=cx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#27406b');sky.addColorStop(0.45,'#e9906b');sky.addColorStop(0.7,'#ffd29a');sky.addColorStop(1,'#ffe9bf');
  cx.fillStyle=sky;cx.fillRect(0,0,W,H);
  /* low sun with a soft halo that swells on the kick */
  const sx=W*0.7,sy=hz-H*0.12,sr=H*0.09;
  const halo=cx.createRadialGradient(sx,sy,0,sx,sy,sr*(5+pulse*1.2));
  halo.addColorStop(0,'rgba(255,240,190,0.9)');halo.addColorStop(0.25,'rgba(255,214,140,0.45)');halo.addColorStop(1,'rgba(255,190,120,0)');
  cx.fillStyle=halo;cx.fillRect(0,0,W,H);
  cx.fillStyle='#fff6d6';cx.beginPath();cx.arc(sx,sy,sr,0,6.283);cx.fill();
  /* drifting clouds */
  const drift=reduceMotion?0:time;
  for(let i=0;i<5;i++){
    const cw=W*(0.14+0.05*(i%3)),cxp=((i*0.27+drift*0.006*(1+i%3*0.4))%1.3-0.15)*W,cyp=H*(0.12+0.09*i%0.4);
    const a=0.5-0.05*i;
    cx.fillStyle='rgba(255,236,214,'+a.toFixed(2)+')';
    [[0,0,1],[0.35,-0.15,0.7],[-0.35,-0.05,0.65],[0.7,0.05,0.5]].forEach(c=>{cx.beginPath();cx.ellipse(cxp+c[0]*cw*0.6,cyp+c[1]*cw*0.25,cw*0.32*c[2],cw*0.11*c[2]+2,0,0,6.283);cx.fill();});
  }
  /* hills in three layers, each drifting a little */
  const layers=[['#6a8f6a',0.0,0.045,2.1,0.2],['#4f7a58',0.05,0.06,1.6,1.4],['#2f5a45',0.1,0.075,1.2,2.6]];
  layers.forEach((L,k)=>{
    cx.fillStyle=L[0];cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=6){const y=hz+H*L[1]+Math.sin(x/W*Math.PI*L[3]+L[4]+drift*0.03*(k+1))*H*L[2]+Math.sin(x/W*Math.PI*5.3+L[4]*2)*H*0.012;cx.lineTo(x,y);}
    cx.lineTo(W,H);cx.closePath();cx.fill();
  });
  /* little trees on the front hill */
  cx.fillStyle='#1f4333';
  for(let i=0;i<9;i++){const tx=W*(0.06+i*0.115+((i*37)%7)*0.004),ty=hz+H*0.2+((i*53)%5)*H*0.02,th=H*(0.07+((i*29)%4)*0.012);
    cx.beginPath();cx.moveTo(tx,ty-th);cx.lineTo(tx+th*0.32,ty);cx.lineTo(tx-th*0.32,ty);cx.closePath();cx.fill();}
  if(S.rain&&false){}
  /* warm pollen sparkles on each note */
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i];f.age+=dt;
    if(f.age>=f.life){flies.splice(i,1);continue;}
    f.x+=(f.vx+Math.sin(time*2+f.p)*10)*dt;f.y+=f.vy*dt;
    const a=Math.sin(Math.PI*f.age/f.life),rad=6+a*6;
    const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,rad);
    g.addColorStop(0,'rgba(255,248,200,'+(0.95*a).toFixed(3)+')');g.addColorStop(1,'rgba(255,214,120,0)');
    cx.fillStyle=g;cx.fillRect(f.x-rad,f.y-rad,rad*2,rad*2);
  }
  pulse=Math.max(0,pulse-dt*3.2);
}
function drawJapan(dt,time){
  cx.setTransform(dpr,0,0,dpr,0,0);
  const wy=H*0.74;
  const sky=cx.createLinearGradient(0,0,0,wy);sky.addColorStop(0,'#080b1f');sky.addColorStop(0.6,'#1b2347');sky.addColorStop(1,'#3a3d6c');
  cx.fillStyle=sky;cx.fillRect(0,0,W,H);
  stars.forEach(s=>{cx.fillStyle='rgba(255,245,230,'+(0.25+0.25*Math.sin(time*0.7+s.p)).toFixed(3)+')';cx.beginPath();cx.arc(s.x*W,s.y*H*0.9,s.s*0.8,0,6.283);cx.fill();});
  /* moon */
  const mx=W*0.72,my=H*0.27,mr=Math.max(14,H*0.085);
  const halo=cx.createRadialGradient(mx,my,0,mx,my,mr*(4.2+pulse*0.8));halo.addColorStop(0,'rgba(255,244,214,0.55)');halo.addColorStop(0.3,'rgba(255,232,190,0.18)');halo.addColorStop(1,'rgba(255,232,190,0)');
  cx.fillStyle=halo;cx.fillRect(0,0,W,wy);
  cx.fillStyle='#fff3d8';cx.beginPath();cx.arc(mx,my,mr,0,6.283);cx.fill();
  /* mountains with mist between */
  const drift=reduceMotion?0:time;
  [['#252d58',0.34,0.05,1.7,0.4],['#1b2347',0.24,0.06,2.3,1.9],['#12183a',0.14,0.07,1.4,3.1]].forEach((L,k)=>{
    cx.fillStyle=L[0];cx.beginPath();cx.moveTo(0,wy);
    for(let x=0;x<=W;x+=6)cx.lineTo(x,wy-H*L[1]+Math.sin(x/W*Math.PI*L[3]+L[4])*H*L[2]+Math.sin(x/W*Math.PI*6.1+L[4]*2)*H*0.012);
    cx.lineTo(W,wy);cx.closePath();cx.fill();
    const mg=cx.createLinearGradient(0,wy-H*(L[1]-0.07),0,wy-H*(L[1]-0.2));mg.addColorStop(0,'rgba(190,200,235,0)');mg.addColorStop(0.5,'rgba(190,200,235,'+(0.1+0.03*Math.sin(drift*0.2+k)).toFixed(3)+')');mg.addColorStop(1,'rgba(190,200,235,0)');
    cx.fillStyle=mg;cx.fillRect(0,wy-H*(L[1]-0.07),W,H*0.13);
  });
  /* pagoda on the left hill */
  const px=W*0.17,pb=wy-H*0.02,pw=Math.min(W*0.12,90),th=H*0.075;
  cx.fillStyle='#070a18';
  for(let i=0;i<4;i++){
    const w=pw*(1-i*0.17),y=pb-th*(i+1)*1.05;
    cx.beginPath();cx.moveTo(px-w*0.62,y+th*0.28);cx.quadraticCurveTo(px-w*0.4,y+th*0.2,px-w*0.28,y);cx.lineTo(px+w*0.28,y);cx.quadraticCurveTo(px+w*0.4,y+th*0.2,px+w*0.62,y+th*0.28);cx.closePath();cx.fill();
    cx.fillRect(px-w*0.2,y+th*0.28,w*0.4,th*0.8);
  }
  cx.fillRect(px-1.5,pb-th*4.6,3,th*0.9);
  cx.fillStyle='rgba(255,200,120,'+(0.5+0.2*Math.sin(time*1.3)).toFixed(3)+')';
  for(let i=0;i<3;i++)cx.fillRect(px-2,pb-th*(i+1)*1.05+th*0.45,4,th*0.35);
  /* lake with the moon's reflection and a small torii */
  const lg=cx.createLinearGradient(0,wy,0,H);lg.addColorStop(0,'#232a52');lg.addColorStop(1,'#0a0d20');
  cx.fillStyle=lg;cx.fillRect(0,wy,W,H-wy);
  for(let i=0;i<10;i++){
    const yy=wy+(i+0.5)*(H-wy)/10,ww=mr*(1.6-i*0.09+Math.sin(time*1.1+i)*0.25);
    cx.fillStyle='rgba(255,238,200,'+(0.2-i*0.015).toFixed(3)+')';cx.fillRect(mx-ww,yy,ww*2,Math.max(1.5,(H-wy)/26));
  }
  const tx=W*0.42,tb=wy+H*0.035,tw=Math.min(W*0.07,56),tp=H*0.12;
  cx.fillStyle='#8f2a33';
  cx.fillRect(tx-tw*0.42,tb-tp,tw*0.1,tp);cx.fillRect(tx+tw*0.32,tb-tp,tw*0.1,tp);
  cx.fillRect(tx-tw*0.34,tb-tp*0.78,tw*0.68,tw*0.07);
  cx.beginPath();cx.moveTo(tx-tw*0.62,tb-tp*1.02);cx.quadraticCurveTo(tx,tb-tp*1.12,tx+tw*0.62,tb-tp*1.02);cx.lineTo(tx+tw*0.56,tb-tp*0.92);cx.quadraticCurveTo(tx,tb-tp*1.02,tx-tw*0.56,tb-tp*0.92);cx.closePath();cx.fill();
  cx.fillStyle='rgba(143,42,51,0.25)';cx.fillRect(tx-tw*0.42,tb,tw*0.84,tp*0.5);
  /* petals */
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i];f.age+=dt;
    if(f.age>=f.life||f.y>H){flies.splice(i,1);continue;}
    f.x+=(f.vx+Math.sin(time*1.4+f.p)*14)*dt;f.y+=f.vy*dt;
    const a=Math.min(1,f.age*1.5)*Math.min(1,(f.life-f.age));
    cx.fillStyle='rgba(255,196,212,'+(0.85*a).toFixed(3)+')';
    cx.beginPath();cx.ellipse(f.x,f.y,4.2,2.3,time*1.2+f.p,0,6.283);cx.fill();
  }
  pulse=Math.max(0,pulse-dt*3.2);
}
function draw(dt,time){
  if(!W||!H)return;
  if(mode==='japan'){drawJapan(dt,time);return;}
  if(mode==='groove'){drawGroove(dt,time);return;}
  cx.setTransform(dpr,0,0,dpr,0,0);
  const sillY=H*0.84,barW=Math.max(6,W*0.011);
  const sky=cx.createLinearGradient(0,0,0,sillY);
  sky.addColorStop(0,'#0f1330');sky.addColorStop(0.55,'#251d42');sky.addColorStop(1,'#4a3350');
  cx.fillStyle=sky;cx.fillRect(0,0,W,H);
  stars.forEach(s=>{cx.fillStyle='rgba(255,240,220,'+(0.35+0.3*Math.sin(time*0.8+s.p)).toFixed(3)+')';cx.beginPath();cx.arc(s.x*W,s.y*H,s.s,0,6.283);cx.fill();});
  bokeh.forEach(b=>{
    const x=b.x*W,y=b.y*H,rad=b.s*W,a=b.a*(0.8+0.2*Math.sin(time*0.6+b.p));
    const g=cx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0,'rgba('+b.c+','+a.toFixed(3)+')');g.addColorStop(1,'rgba('+b.c+',0)');
    cx.fillStyle=g;cx.fillRect(x-rad,y-rad,rad*2,rad*2);
  });
  if(on('rain')){
    cx.strokeStyle='rgba(170,190,235,0.32)';cx.lineWidth=1;cx.beginPath();
    const k=reduceMotion?0.12:1;
    drops.forEach(d=>{
      d.y+=d.v*dt*k;d.x-=d.v*dt*k*0.12;
      if(d.y>sillY){d.y=-d.l;d.x=Math.random()*(W+40);}
      if(d.x<-20)d.x=W+10;
      cx.moveTo(d.x,d.y);cx.lineTo(d.x+d.l*0.12,d.y-d.l);
    });
    cx.stroke();
  }
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i];f.age+=dt;
    if(f.age>=f.life){flies.splice(i,1);continue;}
    f.x+=(f.vx+Math.sin(time*2+f.p)*10)*dt;f.y+=f.vy*dt;
    const a=Math.sin(Math.PI*f.age/f.life),rad=6+a*5;
    const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,rad);
    g.addColorStop(0,'rgba(255,214,150,'+(0.9*a).toFixed(3)+')');g.addColorStop(1,'rgba(255,180,90,0)');
    cx.fillStyle=g;cx.fillRect(f.x-rad,f.y-rad,rad*2,rad*2);
  }
  cx.fillStyle='#0a0c1a';
  cx.fillRect(0,0,W,barW);cx.fillRect(0,0,barW,sillY);cx.fillRect(W-barW,0,barW,sillY);
  cx.fillRect(W/2-barW/2,0,barW,sillY);cx.fillRect(0,sillY*0.52-barW/2,W,barW);
  const sill=cx.createLinearGradient(0,sillY,0,H);
  sill.addColorStop(0,'#2a2038');sill.addColorStop(1,'#151022');
  cx.fillStyle=sill;cx.fillRect(0,sillY,W,H-sillY);
  cx.fillStyle='rgba(255,200,150,0.18)';cx.fillRect(0,sillY,W,2);
  const mw=Math.min(52,W*0.07),mh=mw*0.9,mx=W*0.76,my=sillY-mh+4;
  cx.fillStyle='#3a2b44';
  cx.beginPath();cx.moveTo(mx,my);cx.lineTo(mx+mw,my);cx.lineTo(mx+mw*0.92,my+mh);cx.lineTo(mx+mw*0.08,my+mh);cx.closePath();cx.fill();
  cx.strokeStyle='#3a2b44';cx.lineWidth=Math.max(3,mw*0.1);
  cx.beginPath();cx.arc(mx+mw+mw*0.05,my+mh*0.45,mh*0.3,-1.2,1.2);cx.stroke();
  cx.fillStyle='#8a5a3a';cx.beginPath();cx.ellipse(mx+mw/2,my+2,mw/2,mw*0.1,0,0,6.283);cx.fill();
  if(!reduceMotion&&Math.random()<dt*7)steam.push({x:mx+mw*(0.3+Math.random()*0.4),y:my,age:0,life:2.2+Math.random(),p:Math.random()*6.28});
  for(let i=steam.length-1;i>=0;i--){
    const s=steam[i];s.age+=dt;
    if(s.age>=s.life){steam.splice(i,1);continue;}
    s.y-=16*dt*(H/300);s.x+=Math.sin(time*1.6+s.p)*8*dt;
    const a=Math.sin(Math.PI*s.age/s.life)*0.22,rad=5+s.age*6;
    cx.fillStyle='rgba(255,235,215,'+a.toFixed(3)+')';cx.beginPath();cx.arc(s.x,s.y,rad,0,6.283);cx.fill();
  }
  pulse=Math.max(0,pulse-dt*3.2);
  const la=0.12+0.04*Math.sin(time*0.7)+pulse*0.16;
  const lg=cx.createRadialGradient(W*0.1,H*0.92,0,W*0.1,H*0.92,W*0.62);
  lg.addColorStop(0,'rgba(255,170,80,'+la.toFixed(3)+')');lg.addColorStop(1,'rgba(255,170,80,0)');
  cx.fillStyle=lg;cx.fillRect(0,0,W,H);
}
let lastT=performance.now();
function frame(now){
  processQueue();
  if(now-lastT>=30){const dt=Math.min(0.08,(now-lastT)/1000);lastT=now;draw(dt,now/1000);}
  requestAnimationFrame(frame);
}
